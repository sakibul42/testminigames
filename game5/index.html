<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;800&display=swap" rel="stylesheet">
<title>Bubble Pop Squad</title>
<style>
:root{--bg:#fce7f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fce7f3}}
:root[data-theme="dark"]{--bg:#fce7f3}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{width:min(100vw,calc(100dvh*.6667));aspect-ratio:2/3;height:auto;border-radius:14px;display:block;touch-action:none}
#pin{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,rgba(253,224,71,.35),transparent 40%),radial-gradient(circle at 75% 80%,rgba(56,189,248,.3),transparent 45%),rgba(252,231,243,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:9;font-family:'Baloo Da 2',cursive;overflow:hidden}
#pin .bub{position:absolute;bottom:-60px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,.15) 45%,rgba(244,114,182,.35));animation:up linear infinite;pointer-events:none}
@keyframes up{to{transform:translateY(-115vh) translateX(30px)}}
#pin .box{position:relative;background:linear-gradient(#fff,#fff7ed);border:5px solid #f472b6;border-radius:30px;padding:22px 26px 20px;text-align:center;width:270px;box-shadow:0 8px 0 #be185d,0 18px 40px rgba(190,24,93,.35);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#pin .lock{font-size:46px;line-height:1;animation:wig 2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
#pin h2{margin:4px 0 2px;font-size:40px;line-height:1.1;background:linear-gradient(90deg,#ec4899,#f59e0b,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #fff)}
#pin p{margin:0 0 14px;color:#7e22ce;font-size:16px}
#pin input{width:200px;font:800 32px 'Baloo Da 2',monospace;text-align:center;letter-spacing:10px;border:3px solid #c4b5fd;border-radius:18px;padding:6px;outline:none;background:#faf5ff;color:#6b21a8;-webkit-user-select:text;user-select:text;transition:.2s}
#pin input:focus{border-color:#ec4899;box-shadow:0 0 0 5px rgba(236,72,153,.2)}
#pin button{margin-top:14px;font:800 24px 'Baloo Da 2',cursive;color:#fff;background:linear-gradient(#f472b6,#db2777);border:0;border-radius:26px;padding:8px 38px;cursor:pointer;box-shadow:0 5px 0 #9d174d;transition:transform .1s}
#pin button:active{transform:translateY(4px);box-shadow:0 1px 0 #9d174d}
#pin .err{color:#dc2626;font-size:15px;height:20px;margin-top:8px}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}.shk{animation:shk .3s 2}
</style></head><body>
<canvas id="c" width="360" height="540"></canvas>
<div id="pin"><div class="box" id="pinbox"><div class="lock">🔐</div><h2>Ask AMMU!</h2><p>Ammu knows the secret code 🤫</p>
<input id="pinin" maxlength="5" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text">
<div class="err" id="pinerr"></div><button id="pinbtn">Unlock</button></div></div>

function slide(f1,f2,d,type,vol){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain(),n=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);v.gain.setValueAtTime(vol,n);v.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(v);v.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}

/* ---------- helpers ---------- */
const crowdR=()=>10+Math.sqrt(Math.min(N,60))*6.2;
function txt(s,x,y,size,col,w){g.font=(w||800)+' '+size+'px '+FF;g.fillStyle=col||'#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(s,x,y)}
function otxt(s,x,y,size,fill,stroke){g.font='800 '+size+'px '+FF;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=size/4;g.strokeStyle=stroke||'#fff';g.strokeText(s,x,y);g.fillStyle=fill;g.fillText(s,x,y)}
function emo(s,x,y,size){g.font=size+'px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(s,x,y)}
function dot(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function rr(x,y,w,h,r,col){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function face(h,x,y,r){g.save();g.beginPath();g.arc(x,y,r,0,7);g.clip();if(h.img.complete&&h.img.naturalWidth)g.drawImage(h.img,x-r,y-r,r*2,r*2);else{g.fillStyle='#f1c27d';g.fillRect(x-r,y-r,r*2,r*2)}g.restore()}
function photo(h,x,y,r){dot(x,y,r+4,h.dk);dot(x,y,r+1.5,'#fff');face(h,x,y,r)}
function stroller(x,y,k,riders){g.save();g.translate(x,y);g.scale(k,k);
  g.strokeStyle='#475569';g.lineWidth=4;g.lineCap='round';g.beginPath();g.moveTo(30,-4);g.lineTo(54,-40);g.stroke();rr(48,-46,18,8,4,'#1e293b');
  g.fillStyle='#a21caf';g.beginPath();g.moveTo(-40,2);g.arc(-12,2,28,Math.PI,Math.PI*1.55);g.lineTo(-12,2);g.closePath();g.fill();
  riders.forEach((h,i)=>photo(h,-10+i*24-(riders.length-1)*6,-12,15));
  rr(-42,0,78,28,14,'#f472b6');g.fillStyle='rgba(255,255,255,.4)';g.fillRect(-34,6,62,4);
  [[-26,38],[22,38]].forEach(q=>{dot(q[0],q[1],12,'#1e293b');dot(q[0],q[1],5,'#cbd5e1');g.strokeStyle='#cbd5e1';g.lineWidth=2;for(let a=0;a<3;a++){const an=bob/4+a*2.1;g.beginPath();g.moveTo(q[0],q[1]);g.lineTo(q[0]+Math.cos(an)*10,q[1]+Math.sin(an)*10);g.stroke()}});
  g.restore()}
function mini(x,y,r,col,hp){dot(x,y,r,col);g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(x-r*.4,y-r*.55,r*.25,r*.13,-.5,0,7);g.fill();grumpyFace(x,y+r*.05,r,hp)}
function bigKing(x,y,r,hp,fl){dot(x,y,r,fl?'#fff':hp?'#fde047':'#a78bfa');g.fillStyle='rgba(255,255,255,.3)';g.beginPath();g.ellipse(x-r*.4,y-r*.5,r*.25,r*.13,-.5,0,7);g.fill();

function readyPanel(){
  const w=wd(),cyc=(level-1)/4|0,wi=(level-1)%4+1;
  const s=cyc?["The grumpies are back, and bigger!","Pop them all for bonus fun!"]:w.s;
  const L=[[(cyc?'Bonus: ':'World '+wi+': ')+w.n,22,'#be185d'],[s[0],15,'#334155'],[s[1],15,'#334155']];
  if(level===1)L.push(['Pass + and × gates to grow!',15,'#0369a1'],['Avoid spiky balloons ⚠ · Drag to steer',14,'#b91c1c']);
  else L.push(['Boss: '+w.bossName,16,'#7e22ce'],['Drag to steer · blow bubbles!',14,'#0369a1']);

function winPanel(){
  conf.forEach(q=>emo(q.e,q.x,q.y,22));
  const w=wd(),cyc=(level-1)/4|0,gp=(level-1)%4+1,h=chars[skin];
  panel([['Yay! '+w.bossName.replace(/^The /,'').replace(/^Grumpy /,'')+' is happy!',22,'#a21caf'],['“'+w.end+'”',15,'#334155'],[cyc?'Bonus round cleared!':'Gem piece '+gp+' of 4 found!',18,'#b45309'],[cyc?'Squad: '+N+' gummies':'💎'.repeat(gp)+'▫️'.repeat(4-gp),cyc?18:24,'#1e293b'],[h.n+': “'+h.win+'”',15,h.dk],['Tap to continue',20,'#16a34a']])}
function afterWin(){if(level===4){level++;save();startStory('ending',false)}else{level++;save();reset();st='ready'}}

/* ---------- loop & input ---------- */
let acc=0,prev=performance.now();
function loop(now){acc+=Math.min(100,now-prev);prev=now;while(acc>=1000/60){step();acc-=1000/60}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function pt(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function go(){reset();st='play';slide(600,900,.12,'triangle',.1)}
addEventListener('pointerdown',e=>{if(st==='pin')return;const p=pt(e);
  if(st==='play'&&!maiUsed&&Math.hypot(p.x-(W-42),p.y-(H-40))<34){callMaisarah();return}
  if(st==='home'){
    if(Math.abs(p.x-CX)<100&&Math.abs(p.y-345)<36){st='select';slide(600,900,.1,'triangle',.1)}
    else if(Math.abs(p.x-CX)<80&&Math.abs(p.y-421)<20)startStory('intro',true);
  }
  else if(st==='select'){
    if(p.x<120&&p.y>494){st='home';return}
    chars.forEach((h,i)=>{const q=cardPos(i);if(p.x>=q.x&&p.x<=q.x+q.w&&p.y>=q.y&&p.y<=q.y+q.h){skin=i;save();if(!storySeen)startStory('intro',false);else{reset();st='ready'}}})
  }
  else if(st==='story'){if(storyKind==='intro'&&p.x>W-100&&p.y<60)endStory();else nextSlide()}
  else if(st==='play'){if(Math.hypot(p.x-CX,p.y-58)<24){st='pause';return}tx=p.x}
  else if(st==='pause'){if(p.x>70&&p.x<290){if(p.y>191&&p.y<239)st='play';else if(p.y>251&&p.y<299){reset();st='play'}else if(p.y>311&&p.y<359)st='home'}}
  else{
    if(p.x<104&&p.y>80&&p.y<114){st='home';return}
    if(st==='ready')go();
    else if(st==='lose'&&timer>40)go();
    else if(st==='win'&&timer>40)afterWin();
  }});
addEventListener('pointermove',e=>{if(st==='play')tx=pt(e).x});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play')st='pause'});
/* ---------- parent PIN: any 5 characters containing today's day (e.g. 26 or 01) ---------- */
(function(){const ov=document.getElementById('pin'),inp=document.getElementById('pinin'),err=document.getElementById('pinerr'),box=document.getElementById('pinbox');
  function check(){const v=inp.value.trim(),dd=String(new Date().getDate()).padStart(2,'0');
    if(v.length===5&&v.includes(dd)){ov.remove();st='home';happy()}
    else{err.textContent=v.length<5?'Code needs 5 characters':'Oops! Wrong code';inp.value='';box.classList.remove('shk');void box.offsetWidth;box.classList.add('shk');wah()}}
  document.getElementById('pinbtn').addEventListener('click',check);
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')check()});
  ov.addEventListener('pointerdown',e=>e.stopPropagation());
  for(let i=0;i<14;i++){const b=document.createElement('div'),s=14+Math.random()*40;b.className='bub';b.style.cssText='width:'+s+'px;height:'+s+'px;left:'+Math.random()*100+'%;animation-duration:'+(6+Math.random()*8)+'s;animation-delay:-'+Math.random()*10+'s';ov.prepend(b)}
  setTimeout(()=>inp.focus(),200)})();
addEventListener('keydown',e=>{
  if(st==='pin')return;
  if(e.code==='KeyM'){callMaisarah();return}
  if(e.code==='Escape'||e.code==='KeyP'){if(st==='play')st='pause';else if(st==='pause')st='play';return}
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=1;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=1;
  if(e.code==='Space'){if(st==='ready')go();else if(st==='lose'&&timer>40)go();else if(st==='win'&&timer>40)afterWin();else if(st==='story')nextSlide()}});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=0;if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=0});
</script></body></html>
