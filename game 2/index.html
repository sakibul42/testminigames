  if(bump>0)for(let k=0;k<4;k++){const t0=(k/4+off*2)%1,t1=Math.min(1,t0+.06),f0=t0*t0,f1=t1*t1;g.fillStyle=k%2?'#facc15':'#475569';
    g.beginPath();g.moveTo(CX-2*LW*f0,HZ+(PY-HZ)*f0);g.lineTo(CX+2*LW*f0,HZ+(PY-HZ)*f0);g.lineTo(CX+2*LW*f1,HZ+(PY-HZ)*f1);g.lineTo(CX-2*LW*f1,HZ+(PY-HZ)*f1);g.fill()}
  g.strokeStyle='#fff';g.lineCap='butt';
  for(let k=0;k<5;k++){const t0=(k/5+off)%1,t1=t0+.07,f0=t0*t0,f1=t1*t1;g.lineWidth=Math.max(1,4*f0);
    [-1,0,1].forEach(s=>{g.beginPath();g.moveTo(CX+s*LW*f0,HZ+(PY-HZ)*f0);g.lineTo(CX+s*LW*f1,HZ+(PY-HZ)*f1);g.stroke()});
    const t=(k/5+off+.1)%1,f=t*t;if(f>.02)[-1,1].forEach(s=>{const x=CX+s*(2*LW+30)*f,y=HZ+(PY-HZ)*f;emo('🌳',x,y-30*f,90*f)})}
  for(const it of [...items].sort((a,b)=>a.t-b.t)){const f=it.t*it.t;if(f<.01)continue;
    const y=HZ+(PY-HZ)*f,x=CX+(it.lane-1.5)*LW*f,s=60*f,b=bump>0?Math.abs(Math.sin(bob/4+it.lane))*8*f:0;tok(x,y-s*.5-b,s,it)}
  drawV(chars[me],CX+(L-1.5)*LW,PY+22,1.05,1);
  pops.forEach(q=>{g.font='800 38px '+FF;g.textAlign='center';g.textBaseline='middle';g.lineWidth=7;g.strokeStyle='#fff';g.lineJoin='round';g.strokeText(q.s,q.x,q.y);g.fillStyle=q.c;g.fillText(q.s,q.x,q.y)});
  g.restore();
  rr(44,16,W-88,12,6,'rgba(255,255,255,.75)');rr(44,16,Math.max(12,(W-88)*p),12,6,'#f472b6');emo('🏠',24,22,22);emo('🌯',W-24,22,22);emo('🚗',44+(W-88)*p,22,18);
  const low=coins<=3;rr(14,40,120,36,18,low&&bob%30<15?'#fecaca':'rgba(255,255,255,.95)');emo('🪙',34,58,22);txt(coins,88,58,26,low?'#dc2626':'#b45309');
  rr(W-130,40,116,26,13,'rgba(255,255,255,.95)');txt('Stage '+(stg+1)+'/4',W-72,53,15,'#7e22ce');
  if(st==='play'||st==='pause'){dot(CX,58,19,'rgba(255,255,255,.95)');rr(CX-7,48,5,20,2,'#7e22ce');rr(CX+2,48,5,20,2,'#7e22ce')}
  if(msg&&st==='play'){g.globalAlpha=Math.min(1,msg.t/20);rr(30,92,300,34,17,'rgba(255,255,255,.95)');txt(msg.s,CX,109,17,msg.c);g.globalAlpha=1}
  if(st!=='play'&&st!=='pause'){rr(14,84,86,26,13,'rgba(255,255,255,.85)');txt('☰ Menu',57,97,15,'#3b0764')}
  if(st==='ready')panel([['🌯 Shawarma Math Sprint',21],['Collect green + , dodge red −',16,'#15803d'],['Tap left or right to change lane',15,'#334155'],['Keep your coins above 0!',16,'#b45309'],['Get to the shop to buy shawarma',14,'#a21caf'],['Tap to start!',20,'#16a34a']]);
  if(st==='pause'){rr(25,150,310,225,24,'#fffbeb');g.strokeStyle='#f472b6';g.lineWidth=4;g.beginPath();g.roundRect(25,150,310,225,24);g.stroke();txt('⏸ Paused',W/2,175,28,'#1e293b');[['▶ Resume','#16a34a',215],['↻ Restart','#f59e0b',275],['☰ Menu','#8b5cf6',335]].forEach(b=>{rr(70,b[2]-24,220,48,24,b[1]);txt(b[0],W/2,b[2],22,'#fff')})}
  if(st==='dead')panel([['😭 Zero coins!',32],['Can\'t afford shawarma today',16,'#b45309'],['You got '+Math.floor(p*100)+'% of the way',17,'#a21caf'],['Tap to try again',20,'#16a34a']]);
  if(st==='win'){conf.forEach(q=>emo(q.e,q.x,q.y,22));const n=Math.floor(coins/PRICE);
    panel([['🎉 Shawarma time! 🎉',26],['You arrived with '+coins+' coins',18,'#b45309'],['Each shawarma = '+PRICE+' coins',15,'#334155'],['You can buy '+n+' 🌯 !',24,'#16a34a'],['Tap to play again',16,'#a21caf']])}
}
function fancy(s,x,y,size){g.font='800 '+size+'px '+FF;g.textAlign='left';g.textBaseline='middle';g.lineJoin='round';
  const cols=['#f472b6','#fbbf24','#4ade80','#38bdf8','#c084fc'],ch=[...s],ws=ch.map(q=>g.measureText(q).width);let cx=x-ws.reduce((a,b)=>a+b,0)/2;
  ch.forEach((q,i)=>{const yy=y+Math.sin(bob/15+i)*4;g.lineWidth=size/4;g.strokeStyle='#fff';g.strokeText(q,cx,yy);g.fillStyle=['#ec4899','#f59e0b','#16a34a','#0ea5e9','#8b5cf6'][i%5];g.fillText(q,cx,yy);cx+=ws[i]})}

  [['+3',60,'#16a34a'],['−2',300,'#dc2626'],['+1',110,'#16a34a'],['−4',250,'#dc2626']].forEach((q,i)=>tok(q[1],255+Math.sin(bob/20+i)*8+i*10,46,{v:q[0]==='+'?1:+q[0].replace('−','-')||1,sp:0,e:['🤑','🐦','🥤','🐪'][i],_:q}));

  const k=1+Math.sin(bob/12)*.04;g.save();g.translate(CX,350);g.scale(k,k);rr(-100,-34,200,68,34,'#9d174d');rr(-95,-31,190,54,30,'#ec4899');txt('▶ Play',0,-4,36,'#fff');g.restore();

const cardPos=i=>({x:15,y:78+i*136,w:330,h:122});
function drawSelect(){bgScene();rr(0,HZ,W,H,0,'#86efac');txt('Pick your racer!',CX,42,32,'#1e3a8a');
  chars.forEach((h,i)=>{const q=cardPos(i),fy=q.y+q.h/2;rr(q.x,q.y,q.w,q.h,22,'#fffbeb');g.strokeStyle=h.col;g.lineWidth=5;g.beginPath();g.roundRect(q.x,q.y,q.w,q.h,22);g.stroke();
    dot(q.x+56,fy,44,h.col);face(h,q.x+56,fy,40);g.textAlign='left';g.font='800 22px '+FF;g.fillStyle='#1e293b';g.fillText(h.n,q.x+112,fy);drawV(h,q.x+q.w-62,q.y+q.h-12,.72,0)});
  rr(14,498,96,34,17,'rgba(255,255,255,.85)');txt('◀ Back',62,515,16,'#3b0764')}
let acc=0,prev=performance.now();
function loop(now){acc+=Math.min(100,now-prev);prev=now;while(acc>=1000/60){step();acc-=1000/60}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function pt(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function go(){if(st==='ready'||timer>40){reset();st='play';beep(600,.1)}}
addEventListener('pointerdown',e=>{const p=pt(e);
  if(st==='home'){st='select';beep(600,.08)}
  else if(st==='select'){if(p.x<120&&p.y>494){st='home';return}chars.forEach((h,i)=>{const q=cardPos(i);if(p.x>=q.x&&p.x<=q.x+q.w&&p.y>=q.y&&p.y<=q.y+q.h){me=i;reset();st='ready'}})}
  else if(st==='play'){if(Math.hypot(p.x-CX,p.y-58)<26){st='pause';return}steer(p.x<W/2?-1:1)}
  else if(st==='pause'){if(p.x>70&&p.x<290){if(p.y>191&&p.y<239)st='play';else if(p.y>251&&p.y<299){reset();st='play'}else if(p.y>311&&p.y<359)st='home'}}
  else{if(p.x<104&&p.y>80&&p.y<114){st='home';return}go()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play')st='pause'});
addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(st==='play')st='pause';else if(st==='pause')st='play';return}if(st==='play'){if(e.code==='ArrowLeft'||e.code==='KeyA')steer(-1);if(e.code==='ArrowRight'||e.code==='KeyD')steer(1)}else if(e.code==='Space'&&st!=='home'&&st!=='select'&&st!=='pause')go()});
