<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>পিকাবু মাইসারা!</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fde7f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f3d}}
:root[data-theme="dark"]{--bg:#2a1f3d}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none}
#pin{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,rgba(253,224,71,.35),transparent 40%),radial-gradient(circle at 75% 80%,rgba(56,189,248,.3),transparent 45%),rgba(252,231,243,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:9;font-family:'Baloo Da 2','Hind Siliguri','Noto Sans Bengali',sans-serif;overflow:hidden}
#pin .bub{position:absolute;bottom:-60px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,.15) 45%,rgba(244,114,182,.35));animation:up linear infinite;pointer-events:none}
@keyframes up{to{transform:translateY(-115vh) translateX(30px)}}
#pin .box{position:relative;background:linear-gradient(#fff,#fff7ed);border:5px solid #f472b6;border-radius:30px;padding:22px 26px 20px;text-align:center;width:270px;box-shadow:0 8px 0 #be185d,0 18px 40px rgba(190,24,93,.35);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#pin .lock{font-size:46px;line-height:1.2;animation:wig 2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
#pin h2{margin:4px 0 2px;font-size:36px;line-height:1.4;background:linear-gradient(90deg,#ec4899,#f59e0b,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #fff)}
#pin p{margin:0 0 14px;color:#7e22ce;font-size:16px}
#pin input{width:200px;font:800 32px 'Baloo Da 2',monospace;text-align:center;letter-spacing:10px;border:3px solid #c4b5fd;border-radius:18px;padding:6px;outline:none;background:#faf5ff;color:#6b21a8;-webkit-user-select:text;user-select:text;transition:.2s}
#pin input:focus{border-color:#ec4899;box-shadow:0 0 0 5px rgba(236,72,153,.2)}
#pin button{margin-top:14px;font:800 24px 'Baloo Da 2','Hind Siliguri',sans-serif;color:#fff;background:linear-gradient(#f472b6,#db2777);border:0;border-radius:26px;padding:8px 38px;cursor:pointer;box-shadow:0 5px 0 #9d174d;transition:transform .1s}
#pin button:active{transform:translateY(4px);box-shadow:0 1px 0 #9d174d}
#pin .err{color:#dc2626;font-size:15px;height:22px;margin-top:8px}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}.shk{animation:shk .3s 2}
</style></head><body><canvas id="c" width="360" height="540"></canvas>

<input id="pinin" maxlength="5" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text">
<div class="err" id="pinerr"></div><button id="pinbtn">খোলো!</button></div></div>
